<style>
  :root {
    --bg:        #fafaf8;
    --surface:   #ffffff;
    --ink:       #0a0a0a;
    --muted:     #8a8a85;
    --faint:     #b8b8b2;
    --border:    #e6e4dd;
    --border-2:  #d8d6cf;
    --hover:     #f3f1ec;
    --active:    #ecebe5;
    --accent:    #0a0a0a;
    --radius:    8px;
    --radius-sm: 6px;
    --pad-x:     clamp(20px, 4vw, 56px);
    --mono:      "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    min-height: 100dvh;
  }

  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
  a { color: inherit; }
  ::selection { background: #0a0a0a; color: #fafaf8; }

  /* ---------- App shell ---------- */
  .app {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px var(--pad-x);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 500; font-size: 15px; letter-spacing: -0.01em; text-decoration: none; }
  .brand .dot { color: var(--muted); }
  .tagline { color: var(--muted); font-size: 12px; }
  .tagline .sep { margin: 0 8px; color: var(--faint); }

  .footer {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 16px var(--pad-x);
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    flex-wrap: wrap;
  }
  .footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--border-2); padding-bottom: 1px; }
  .footer a:hover { border-color: var(--ink); }

  /* ---------- Main grid layout (side) ---------- */
  .main {
    flex: 1;
    width: 100%;
    padding: 28px var(--pad-x) 40px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(320px, 440px);
    gap: clamp(32px, 5vw, 72px);
    align-items: start;
  }
  .main .preview-col { position: sticky; top: 28px; }

  /* Mobile: stacked, preview first */
  @media (max-width: 760px) {
    .main {
      display: flex;
      flex-direction: column-reverse;
      gap: 28px;
    }
    .main .preview-col { position: static; }
    .preview-col { order: -1; }
  }

  /* ---------- Section blocks ---------- */
  .section { display: flex; flex-direction: column; gap: 10px; }
  .section + .section { margin-top: 24px; }
  .label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .label-row .hint {
    font-size: 11px;
    color: var(--faint);
    text-transform: none;
    letter-spacing: 0;
    font-weight: 400;
  }

  /* ---------- Type picker ---------- */
  .types {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  @media (max-width: 480px) {
    .types { grid-template-columns: repeat(4, 1fr); gap: 4px; }
  }
  .type {
    appearance: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 6px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--ink);
    transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
    min-height: 56px;
  }
  .type:hover { background: var(--hover); }
  .type[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--bg);
  }
  .type svg { width: 16px; height: 16px; display: block; }
  .type .t {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: inherit;
    opacity: 0.85;
    white-space: nowrap;
  }

  /* ---------- Inputs ---------- */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .input, .textarea, .select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 14px;
    line-height: 1.4;
    outline: none;
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }
  .input:focus, .textarea:focus, .select:focus {
    border-color: var(--ink);
    box-shadow: 0 0 0 3px rgba(10,10,10,0.06);
  }
  .textarea { resize: vertical; min-height: 80px; font-family: var(--mono); }
  .input::placeholder, .textarea::placeholder { color: var(--faint); }
  .select {
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%238a8a85' stroke-width='1.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    padding-right: 32px;
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 420px) { .grid-2 { grid-template-columns: 1fr; } }

  /* ---------- Options ---------- */
  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px 20px;
  }
  @media (max-width: 520px) { .options-grid { grid-template-columns: 1fr; } }

  .option { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

  .seg {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 2px;
    gap: 0;
    width: fit-content;
  }
  .seg button {
    appearance: none;
    background: transparent;
    border: 0;
    border-radius: 4px;
    padding: 5px 10px;
    font-size: 12px;
    color: var(--muted);
    min-width: 32px;
    letter-spacing: 0.04em;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--bg);
  }

  .swatches { display: flex; gap: 8px; }
  .swatch {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 1px solid transparent;
    padding: 0;
    cursor: pointer;
    position: relative;
    transition: transform 120ms ease;
  }
  .swatch::after {
    content: "";
    position: absolute; inset: -4px;
    border-radius: 50%;
    border: 1px solid transparent;
    transition: border-color 120ms ease;
  }
  .swatch[aria-pressed="true"]::after { border-color: var(--ink); }
  .swatch:hover { transform: scale(1.05); }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .ghost-btn {
    appearance: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 12px;
    font-size: 12px;
    color: var(--ink);
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .ghost-btn:hover { background: var(--hover); border-color: var(--border-2); }
  .ghost-btn svg { width: 12px; height: 12px; }
  .logo-thumb {
    width: 28px; height: 28px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background-size: cover;
    background-position: center;
    background-color: #fff;
  }
  .link-btn {
    appearance: none;
    background: transparent;
    border: 0;
    color: var(--muted);
    font-size: 11px;
    text-decoration: underline;
    text-decoration-color: var(--border-2);
    text-underline-offset: 3px;
    padding: 0;
  }
  .link-btn:hover { color: var(--ink); }

  /* ---------- Actions ---------- */
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 28px;
  }
  .btn {
    appearance: none;
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.02em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid transparent;
    transition: background 120ms ease, transform 80ms ease, border-color 120ms ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: var(--ink);
    color: var(--bg);
    flex: 1;
  }
  .btn-primary:hover { background: #232323; }
  .btn-primary[disabled] {
    background: #c8c6c0;
    color: #fafaf8;
    cursor: not-allowed;
  }
  .btn-secondary {
    background: var(--surface);
    color: var(--ink);
    border-color: var(--border);
  }
  .btn-secondary:hover { background: var(--hover); }
  .btn-secondary[disabled] { color: var(--faint); cursor: not-allowed; }
  .btn .kbd {
    font-size: 10px;
    color: currentColor;
    opacity: 0.55;
    border: 1px solid currentColor;
    border-radius: 3px;
    padding: 0 4px;
    line-height: 1.4;
    margin-left: 2px;
  }
  .btn svg { width: 14px; height: 14px; }

  .show-on-mobile { display: none; }
  @media (max-width: 760px) {
    .hide-on-mobile { display: none !important; }
    .show-on-mobile { display: inline-flex; }
  }

  /* ---------- Preview ---------- */
  .preview-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .qr-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: border-color 120ms ease;
    width: 100%;
    max-width: 360px;
  }
  .qr-card:hover { border-color: var(--border-2); }
  .qr-card.is-dragging { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(10,10,10,0.06); }
  .qr-canvas-host {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .qr-canvas-host canvas,
  .qr-canvas-host img {
    width: 100% !important;
    height: 100% !important;
    image-rendering: pixelated;
    display: block;
    cursor: grab;
    user-select: none;
    -webkit-user-drag: element;
  }
  .qr-canvas-host canvas:active,
  .qr-canvas-host img:active { cursor: grabbing; }

  .qr-skeleton {
    width: 100%;
    aspect-ratio: 1 / 1;
    position: relative;
    color: var(--ink);
    opacity: 0.14;
  }
  .qr-skeleton svg { width: 100%; height: 100%; display: block; }
  .qr-skeleton-label {
    position: absolute;
    inset: 30% 18%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    opacity: 1;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    background: var(--surface);
    border-radius: 6px;
    pointer-events: none;
    text-align: center;
  }
  .qr-skeleton-wrap { position: relative; width: 100%; aspect-ratio: 1 / 1; }

  .qr-label-caption {
    margin-top: 12px;
    font-size: 12px;
    letter-spacing: 0.04em;
    font-weight: 500;
    text-align: center;
    max-width: 100%;
    word-break: break-word;
  }

  .qr-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    min-height: 14px;
    flex-wrap: wrap;
  }
  .qr-meta > span { white-space: nowrap; }
  .qr-meta .dotsep { color: var(--faint); }
  .qr-meta .copied { color: var(--ink); }

  .hotkeys-hint {
    margin-top: 14px;
    font-size: 11px;
    color: var(--faint);
    letter-spacing: 0.04em;
    text-align: center;
    line-height: 1.7;
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--ink);
    color: var(--bg);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: 0.04em;
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms ease, transform 200ms ease;
    z-index: 1000;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* utility */
  .sr-only, .visually-hidden {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>
  <h1 class="visually-hidden">0qr.app: Free QR Code Generator</h1>
  <div class="app">
    <header class="topbar">
      <a href="/" class="brand" aria-label="0qr.app home">0qr<span class="dot">.app</span></a>
      <div class="tagline">Free<span class="sep">·</span>Instant<span class="sep">·</span>No&nbsp;ads</div>
    </header>

    <main class="main">
      <div class="form-col">
        <div class="section">
          <span class="label">Type</span>
          <div class="types" id="types" role="tablist" aria-label="QR type"></div>
        </div>

        <div class="section">
          <span class="label">Content</span>
          <div id="fields"></div>
        </div>

        <div class="section">
          <span class="label">Options</span>
          <div class="options-grid">
            <div class="option">
              <div class="label-row">
                <span class="label">Size</span>
                <span class="hint" id="size-hint"></span>
              </div>
              <div class="seg" id="size-seg" role="radiogroup" aria-label="Size"></div>
            </div>
            <div class="option">
              <div class="label-row">
                <span class="label">ECC</span>
                <span class="hint" id="ecc-hint"></span>
              </div>
              <div class="seg" id="ecc-seg" role="radiogroup" aria-label="ECC"></div>
            </div>
            <div class="option">
              <span class="label">Color</span>
              <div class="swatches" id="swatches" role="radiogroup" aria-label="Color"></div>
            </div>
            <div class="option">
              <span class="label">Logo</span>
              <div class="logo-row">
                <div class="logo-thumb" id="logo-thumb" style="display:none"></div>
                <button type="button" class="ghost-btn" id="logo-btn">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/></svg>
                  <span id="logo-btn-label">Upload</span>
                </button>
                <button type="button" class="link-btn" id="logo-remove" style="display:none">remove</button>
                <input type="file" id="logo-input" accept="image/*" class="sr-only">
              </div>
            </div>
            <div class="option">
              <span class="label">Label</span>
              <input class="input" id="label-input" placeholder="Your text" maxlength="40" aria-label="Label">
            </div>
          </div>
        </div>
      </div>

      <div class="preview-col">
        <div class="preview-wrap">
          <div class="qr-card" id="qr-card">
            <div class="qr-canvas-host" id="qr-host"></div>
            <div class="qr-label-caption" id="qr-label-caption" style="display:none"></div>
          </div>
          <div class="qr-meta" id="qr-meta"><span>preview</span></div>
        </div>
        <div class="hotkeys-hint hide-on-mobile" id="hotkeys-hint">
          ⌘↵ download &nbsp;·&nbsp; ⌘C copy &nbsp;·&nbsp; drag QR anywhere
        </div>
      </div>
    </main>

    <footer class="footer">
      <span>100% client-side. Nothing leaves your browser.&nbsp;<a href="https://github.com/aleshkovskiy/0qr.app" target="_blank" rel="noopener noreferrer">open source</a></span>
      <span>0qr.app · free forever</span>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

<script>
(function () {
  "use strict";

  // Allow non-ASCII data (vCard, WhatsApp text, Cyrillic, etc.) by overriding
  // qrcode-generator's default ASCII stringToBytes with a UTF-8 encoder.
  if (typeof qrcode === "function") {
    qrcode.stringToBytes = function (s) {
      return Array.from(new TextEncoder().encode(s));
    };
  }

  // ---------- Icons ----------
  const ICONS = {
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.8 3 2.8 15 0 18"/><path d="M12 3c-2.8 3-2.8 15 0 18"/>',
    text: '<path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h10"/>',
    wifi: '<path d="M3 9a14 14 0 0 1 18 0"/><path d="M6 12.5a10 10 0 0 1 12 0"/><path d="M9 16a6 6 0 0 1 6 0"/><circle cx="12" cy="19" r="0.8" fill="currentColor"/>',
    card: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M14 10h4"/><path d="M14 13h3"/><path d="M6 16h7"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6 8.5-6"/>',
    sms: '<path d="M4 6h16v10H8l-4 4z"/>',
    whatsapp: '<path d="M4 20l1.6-4.4A8 8 0 1 1 8.5 18.5z"/>',
    phone: '<path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A14 14 0 0 1 4 7a2 2 0 0 1 1-3z"/>',
    download: '<path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/>',
    copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
    share: '<path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>'
  };
  function svgIcon(name) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
  }
  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // ---------- Types: field schema + serializer ----------
  const TYPES = [
    { id: "url", label: "URL", icon: "globe",
      fields: [{ id: "url", type: "url", placeholder: "https://example.com" }],
      defaults: { url: "" },
      serialize: s => (s.url || "").trim() },

    { id: "text", label: "TEXT", icon: "text",
      fields: [{ id: "text", type: "textarea", placeholder: "Any text, note, or message…" }],
      defaults: { text: "" },
      serialize: s => s.text || "" },

    { id: "wifi", label: "WI-FI", icon: "wifi",
      fields: [
        { id: "ssid", type: "text", label: "Network name (SSID)", placeholder: "MyNetwork" },
        { row: [
          { id: "password", type: "text", label: "Password", placeholder: "••••••••" },
          { id: "encryption", type: "select", label: "Encryption",
            options: [["WPA", "WPA / WPA2"], ["WEP", "WEP"], ["nopass", "None"]] }
        ] }
      ],
      defaults: { ssid: "", password: "", encryption: "WPA" },
      serialize: s => {
        if (!s.ssid) return "";
        const e = v => String(v || "").replace(/([\\;,:"])/g, "\\$1");
        const t = s.encryption === "nopass" ? "nopass" : s.encryption;
        const pwd = s.encryption === "nopass" ? "" : e(s.password);
        return `WIFI:T:${t};S:${e(s.ssid)};P:${pwd};H:false;;`;
      } },

    { id: "vcard", label: "VCARD", icon: "card",
      fields: [
        { row: [
          { id: "firstName", type: "text", label: "First name" },
          { id: "lastName", type: "text", label: "Last name" }
        ] },
        { row: [
          { id: "phone", type: "tel", label: "Phone" },
          { id: "email", type: "email", label: "Email" }
        ] },
        { id: "org", type: "text", label: "Organization" },
        { id: "url", type: "url", label: "Website", placeholder: "https://" }
      ],
      defaults: { firstName: "", lastName: "", phone: "", email: "", org: "", url: "" },
      serialize: s => {
        if (!s.firstName && !s.lastName && !s.phone && !s.email) return "";
        const parts = ["BEGIN:VCARD", "VERSION:3.0"];
        const fn = [s.firstName, s.lastName].filter(Boolean).join(" ");
        if (fn) parts.push(`FN:${fn}`);
        parts.push(`N:${s.lastName || ""};${s.firstName || ""};;;`);
        if (s.org) parts.push(`ORG:${s.org}`);
        if (s.phone) parts.push(`TEL;TYPE=CELL:${s.phone}`);
        if (s.email) parts.push(`EMAIL:${s.email}`);
        if (s.url) parts.push(`URL:${s.url}`);
        parts.push("END:VCARD");
        return parts.join("\n");
      } },

    { id: "email", label: "EMAIL", icon: "mail",
      fields: [
        { id: "to", type: "email", label: "Email", placeholder: "hello@example.com" },
        { id: "subject", type: "text", label: "Subject (optional)" },
        { id: "body", type: "textarea", label: "Body (optional)" }
      ],
      defaults: { to: "", subject: "", body: "" },
      serialize: s => {
        if (!s.to) return "";
        const params = [];
        if (s.subject) params.push("subject=" + encodeURIComponent(s.subject));
        if (s.body) params.push("body=" + encodeURIComponent(s.body));
        return `mailto:${s.to}${params.length ? "?" + params.join("&") : ""}`;
      } },

    { id: "sms", label: "SMS", icon: "sms",
      fields: [
        { id: "phone", type: "tel", label: "Phone", placeholder: "+1 555 1234" },
        { id: "body", type: "textarea", label: "Message (optional)" }
      ],
      defaults: { phone: "", body: "" },
      serialize: s => {
        if (!s.phone) return "";
        return `SMSTO:${s.phone.replace(/\s+/g, "")}:${s.body || ""}`;
      } },

    { id: "whatsapp", label: "WHATSAPP", icon: "whatsapp",
      fields: [
        { id: "phone", type: "tel", label: "Phone (with country code)", placeholder: "15551234567" },
        { id: "body", type: "textarea", label: "Message (optional)" }
      ],
      defaults: { phone: "", body: "" },
      serialize: s => {
        if (!s.phone) return "";
        const phone = s.phone.replace(/[^\d]/g, "");
        const tail = s.body ? "?text=" + encodeURIComponent(s.body) : "";
        return `https://wa.me/${phone}${tail}`;
      } },

    { id: "phone", label: "PHONE", icon: "phone",
      fields: [{ id: "phone", type: "tel", placeholder: "+1 555 1234" }],
      defaults: { phone: "" },
      serialize: s => (s.phone ? `tel:${s.phone.replace(/\s+/g, "")}` : "") }
  ];
  const TYPE_BY_ID = {};
  TYPES.forEach(t => { TYPE_BY_ID[t.id] = t; });

  // ---------- Options config ----------
  const SIZES = ["S", "M", "L", "XL"];
  const SIZE_PX = { S: 480, M: 720, L: 960, XL: 1280 };
  const ECLS = ["L", "M", "Q", "H"];
  const ECC_HINT = { L: "~7%", M: "~15%", Q: "~25%", H: "~30%" };
  const COLORS = [
    { hex: "#0a0a0a", name: "Black" },
    { hex: "#1c4ed8", name: "Blue" },
    { hex: "#1b6f3a", name: "Green" },
    { hex: "#9b1c1c", name: "Red" },
    { hex: "#5b21b6", name: "Purple" }
  ];

  // ---------- State ----------
  const state = {
    type: "url",
    form: {},
    size: "M",
    ecl: "M",
    color: "#0a0a0a",
    logo: "",        // dataURL
    logoImg: null,   // decoded Image for baking
    label: ""
  };
  TYPES.forEach(t => { state.form[t.id] = Object.assign({}, t.defaults); });

  // ---------- DOM refs ----------
  const $ = id => document.getElementById(id);
  const typesEl = $("types");
  const fieldsEl = $("fields");
  const sizeSeg = $("size-seg");
  const eccSeg = $("ecc-seg");
  const swatchesEl = $("swatches");
  const sizeHint = $("size-hint");
  const eccHint = $("ecc-hint");
  const host = $("qr-host");
  const card = $("qr-card");
  const metaEl = $("qr-meta");
  const labelCaption = $("qr-label-caption");
  const toastEl = $("toast");

  let canvas = null;     // current rendered <canvas>
  let ready = false;     // QR currently rendered & exportable
  let payload = "";
  let copiedFlash = false;
  let dragging = false;

  // ---------- QR render helpers ----------
  function renderQRToCanvas(text, ecl, cnv, targetSize, dark, light) {
    const qr = qrcode(0, ecl);
    qr.addData(text);
    qr.make();
    const n = qr.getModuleCount();
    const margin = 2;
    const cellSize = Math.max(1, Math.floor(targetSize / (n + margin * 2)));
    const actualSize = cellSize * (n + margin * 2);
    cnv.width = actualSize;
    cnv.height = actualSize;
    const ctx = cnv.getContext("2d");
    ctx.fillStyle = light;
    ctx.fillRect(0, 0, actualSize, actualSize);
    ctx.fillStyle = dark;
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        if (qr.isDark(r, c)) {
          ctx.fillRect((c + margin) * cellSize, (r + margin) * cellSize, cellSize, cellSize);
        }
      }
    }
  }

  function buildQRSvg(text, ecl, dark, light) {
    const qr = qrcode(0, ecl);
    qr.addData(text);
    qr.make();
    const n = qr.getModuleCount();
    const margin = 2;
    const total = n + margin * 2;
    let path = "";
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        if (qr.isDark(r, c)) path += `M${c + margin} ${r + margin}h1v1h-1z`;
      }
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" width="512" height="512" shape-rendering="crispEdges"><rect width="${total}" height="${total}" fill="${light}"/><path fill="${dark}" d="${path}"/></svg>`;
  }

  let skeletonSvg = null;
  function skeletonHTML() {
    if (skeletonSvg === null) {
      try {
        const qr = qrcode(0, "M");
        qr.addData("0qr.app");
        qr.make();
        const n = qr.getModuleCount();
        const margin = 2;
        const total = n + margin * 2;
        let path = "";
        for (let r = 0; r < n; r++) {
          for (let c = 0; c < n; c++) {
            if (qr.isDark(r, c)) path += `M${c + margin} ${r + margin}h1v1h-1z`;
          }
        }
        skeletonSvg = `<svg viewBox="0 0 ${total} ${total}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="${path}"/></svg>`;
      } catch (_) {
        skeletonSvg = "";
      }
    }
    return '<div class="qr-skeleton-wrap" aria-hidden="true">' +
      '<div class="qr-skeleton">' + skeletonSvg + '</div>' +
      '<div class="qr-skeleton-label">fill in the fields</div></div>';
  }

  // ---------- Build static controls ----------
  function buildTypes() {
    typesEl.innerHTML = TYPES.map(t =>
      `<button type="button" role="tab" class="type" data-type="${t.id}" aria-pressed="false" aria-selected="false">` +
      svgIcon(t.icon) + `<span class="t">${t.label}</span></button>`
    ).join("");
  }

  function buildSeg(el, values, current) {
    el.innerHTML = values.map(v =>
      `<button type="button" role="radio" data-v="${v}" aria-pressed="${v === current}" aria-checked="${v === current}">${v}</button>`
    ).join("");
  }

  function buildSwatches() {
    swatchesEl.innerHTML = COLORS.map(c =>
      `<button type="button" role="radio" class="swatch" data-hex="${c.hex}" aria-label="${c.name}" ` +
      `aria-pressed="${c.hex === state.color}" aria-checked="${c.hex === state.color}" style="background:${c.hex}"></button>`
    ).join("");
  }

  function setPressed(container, attrVal, attrName) {
    Array.prototype.forEach.call(container.querySelectorAll("[" + attrName + "]"), btn => {
      const on = btn.getAttribute(attrName) === String(attrVal);
      btn.setAttribute("aria-pressed", on);
      btn.setAttribute("aria-checked", on);
    });
  }

  // ---------- Render per-type fields ----------
  function renderFields() {
    const t = TYPE_BY_ID[state.type];
    const bucket = state.form[state.type];
    let html = "";
    t.fields.forEach(f => {
      if (f.row) {
        html += '<div class="grid-2">' + f.row.map(sub => fieldHTML(sub, bucket)).join("") + "</div>";
      } else {
        html += fieldHTML(f, bucket);
      }
    });
    fieldsEl.innerHTML = html;
    // wire inputs
    Array.prototype.forEach.call(fieldsEl.querySelectorAll("[data-fid]"), el => {
      const handler = e => {
        bucket[e.target.getAttribute("data-fid")] = e.target.value;
        scheduleGen();
      };
      el.addEventListener("input", handler);
      el.addEventListener("change", handler);
    });
  }

  function fieldHTML(f, bucket) {
    const val = esc(bucket[f.id]);
    const labelHTML = f.label ? `<label class="label" for="f_${f.id}">${esc(f.label)}</label>` : "";
    let control;
    if (f.type === "textarea") {
      control = `<textarea class="textarea" id="f_${f.id}" data-fid="${f.id}" placeholder="${esc(f.placeholder || "")}">${val}</textarea>`;
    } else if (f.type === "select") {
      const opts = (f.options || []).map(o =>
        `<option value="${esc(o[0])}"${o[0] === bucket[f.id] ? " selected" : ""}>${esc(o[1])}</option>`
      ).join("");
      control = `<select class="select" id="f_${f.id}" data-fid="${f.id}">${opts}</select>`;
    } else {
      const im = f.type === "tel" ? "tel" : f.type === "email" ? "email" : f.type === "url" ? "url" : "";
      control = `<input class="input" id="f_${f.id}" data-fid="${f.id}" type="${f.type}"` +
        (im ? ` inputmode="${im}"` : "") +
        ` placeholder="${esc(f.placeholder || "")}" value="${val}">`;
    }
    return `<div class="field">${labelHTML}${control}</div>`;
  }

  // ---------- Generate / preview ----------
  let debounce = null;
  function scheduleGen() {
    clearTimeout(debounce);
    debounce = setTimeout(gen, 100);
  }

  function effectiveEcl() {
    // Logo occludes modules — bump correction to H so the code still scans.
    return state.logo ? "H" : state.ecl;
  }

  function gen() {
    const t = TYPE_BY_ID[state.type];
    payload = t.serialize(state.form[state.type]);

    // label caption (below QR, not baked into export)
    if (state.label && payload) {
      labelCaption.textContent = state.label;
      labelCaption.style.color = state.color;
      labelCaption.style.display = "";
    } else {
      labelCaption.style.display = "none";
    }

    if (!payload) {
      ready = false;
      canvas = null;
      host.innerHTML = skeletonHTML();
      renderMeta();
      syncActions();
      return;
    }

    const px = SIZE_PX[state.size];
    try {
      const c = document.createElement("canvas");
      renderQRToCanvas(payload, effectiveEcl(), c, px, state.color, "#ffffff");
      canvas = c;
      c.setAttribute("draggable", "false");
      c.setAttribute("aria-label", "QR code preview (drag to save)");
      c.addEventListener("dragstart", onDragStart);
      c.addEventListener("dragend", onDragEnd);
      host.innerHTML = "";
      host.appendChild(c);
    } catch (err) {
      ready = false;
      canvas = null;
      host.innerHTML = skeletonHTML();
      metaEl.innerHTML = '<span class="copied">too much data — lower ECC or shorten</span>';
      syncActions();
      return;
    }

    if (state.logo && state.logoImg) {
      const ctx = canvas.getContext("2d");
      const logoSize = canvas.width * 0.22;
      const x = (canvas.width - logoSize) / 2;
      const y = (canvas.height - logoSize) / 2;
      const pad = logoSize * 0.12;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(x - pad, y - pad, logoSize + pad * 2, logoSize + pad * 2);
      ctx.drawImage(state.logoImg, x, y, logoSize, logoSize);
    }

    ready = true;
    canvas.setAttribute("draggable", "true");
    renderMeta();
    syncActions();
  }

  function renderMeta() {
    if (copiedFlash) {
      metaEl.innerHTML = '<span class="copied">copied to clipboard</span>';
      return;
    }
    if (!payload || !ready) {
      metaEl.innerHTML = "<span>preview</span>";
      return;
    }
    const dims = SIZE_PX[state.size] + "×" + SIZE_PX[state.size];
    metaEl.innerHTML =
      `<span>${dims}</span>` +
      `<span class="dotsep">·</span>` +
      `<span>ECC ${effectiveEcl()}</span>` +
      `<span class="dotsep hide-on-mobile">·</span>` +
      `<span class="hide-on-mobile">drag to save</span>`;
  }

  // ---------- Actions ----------
  function filename(ext) {
    const slug = String(state.label || payload || "")
      .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 32) || "qr";
    return "qr-" + slug + "." + ext;
  }

  function downloadPNG() {
    if (!ready || !canvas) return;
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = filename("png");
    document.body.appendChild(a); a.click(); a.remove();
    showToast("downloaded");
  }

  function downloadSVG() {
    if (!payload) return;
    let svgString;
    try { svgString = buildQRSvg(payload, effectiveEcl(), state.color, "#ffffff"); }
    catch (_) { return; }
    const blob = new Blob([svgString], { type: "image/svg+xml" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename("svg");
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast("svg downloaded");
  }

  function flashCopied() {
    copiedFlash = true;
    renderMeta();
    setTimeout(() => { copiedFlash = false; renderMeta(); }, 1600);
  }

  async function copy() {
    if (!ready || !canvas) return;
    try {
      const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
      if (!blob) return;
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
      flashCopied();
      showToast("image copied");
    } catch (e) {
      try {
        await navigator.clipboard.writeText(payload);
        flashCopied();
        showToast("text copied");
      } catch (_) {}
    }
  }

  async function share() {
    if (!ready || !canvas) return;
    try {
      const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
      if (!blob) return;
      const file = new File([blob], filename("png"), { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "QR code", text: state.label || "" });
        showToast("shared");
      } else if (navigator.share) {
        await navigator.share({ title: "QR code", text: payload });
        showToast("shared");
      }
    } catch (_) { /* user cancelled */ }
  }

  // ---------- Drag QR out to filesystem / chat ----------
  function onDragStart(e) {
    if (!ready || !canvas) { e.preventDefault(); return; }
    try {
      const dataUrl = canvas.toDataURL("image/png");
      e.dataTransfer.effectAllowed = "copy";
      e.dataTransfer.setData("DownloadURL", `image/png:${filename("png")}:${dataUrl}`);
      e.dataTransfer.setData("text/uri-list", dataUrl);
      e.dataTransfer.setData("text/plain", payload);
      if (e.dataTransfer.setDragImage) e.dataTransfer.setDragImage(canvas, 32, 32);
      dragging = true;
      card.classList.add("is-dragging");
    } catch (_) {}
  }
  function onDragEnd() {
    dragging = false;
    card.classList.remove("is-dragging");
  }

  // ---------- Action buttons (built dynamically for Share/SVG fallback) ----------
  let dlBtn, copyBtn, thirdBtn;
  function buildActions() {
    const wrap = document.createElement("div");
    wrap.className = "actions";

    dlBtn = document.createElement("button");
    dlBtn.className = "btn btn-primary";
    dlBtn.disabled = true;
    dlBtn.title = "Download PNG  ⌘↵";
    dlBtn.setAttribute("aria-label", "Download PNG");
    dlBtn.innerHTML = svgIcon("download") + "Download<span class=\"kbd hide-on-mobile\">⌘↵</span>";
    dlBtn.addEventListener("click", downloadPNG);

    copyBtn = document.createElement("button");
    copyBtn.className = "btn btn-secondary";
    copyBtn.disabled = true;
    copyBtn.title = "Copy  ⌘C";
    copyBtn.setAttribute("aria-label", "Copy image to clipboard");
    copyBtn.innerHTML = svgIcon("copy") + '<span class="hide-on-mobile">Copy</span>';
    copyBtn.addEventListener("click", copy);

    thirdBtn = document.createElement("button");
    thirdBtn.className = "btn btn-secondary";
    thirdBtn.disabled = true;
    const canShare = typeof navigator !== "undefined" && !!navigator.share;
    if (canShare) {
      thirdBtn.title = "Share";
      thirdBtn.setAttribute("aria-label", "Share");
      thirdBtn.innerHTML = svgIcon("share") + '<span class="hide-on-mobile">Share</span>';
      thirdBtn.addEventListener("click", share);
    } else {
      thirdBtn.title = "Download SVG  ⌘⇧S";
      thirdBtn.setAttribute("aria-label", "Download SVG");
      thirdBtn.textContent = "SVG";
      thirdBtn.addEventListener("click", downloadSVG);
    }

    wrap.appendChild(dlBtn);
    wrap.appendChild(copyBtn);
    wrap.appendChild(thirdBtn);
    document.querySelector(".preview-wrap").appendChild(wrap);
  }

  function syncActions() {
    dlBtn.disabled = !ready;
    copyBtn.disabled = !ready;
    thirdBtn.disabled = !ready;
  }

  // ---------- Toast ----------
  let toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
  }

  // ---------- Wire up events ----------
  typesEl.addEventListener("click", e => {
    const btn = e.target.closest("[data-type]");
    if (!btn) return;
    const id = btn.getAttribute("data-type");
    if (id === state.type) return;
    state.type = id;
    setPressed(typesEl, id, "data-type");
    renderFields();
    gen();
  });

  sizeSeg.addEventListener("click", e => {
    const btn = e.target.closest("[data-v]"); if (!btn) return;
    state.size = btn.getAttribute("data-v");
    setPressed(sizeSeg, state.size, "data-v");
    sizeHint.textContent = SIZE_PX[state.size] + "px";
    gen();
  });

  eccSeg.addEventListener("click", e => {
    const btn = e.target.closest("[data-v]"); if (!btn) return;
    state.ecl = btn.getAttribute("data-v");
    setPressed(eccSeg, state.ecl, "data-v");
    eccHint.textContent = ECC_HINT[state.ecl];
    gen();
  });

  swatchesEl.addEventListener("click", e => {
    const btn = e.target.closest("[data-hex]"); if (!btn) return;
    state.color = btn.getAttribute("data-hex");
    setPressed(swatchesEl, state.color, "data-hex");
    gen();
  });

  // Logo
  const logoInput = $("logo-input");
  const logoThumb = $("logo-thumb");
  const logoRemove = $("logo-remove");
  const logoBtnLabel = $("logo-btn-label");
  $("logo-btn").addEventListener("click", () => logoInput.click());
  logoInput.addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        state.logo = r.result;
        state.logoImg = img;
        logoThumb.style.backgroundImage = `url(${r.result})`;
        logoThumb.style.display = "";
        logoRemove.style.display = "";
        logoBtnLabel.textContent = "Replace";
        gen();
      };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  });
  logoRemove.addEventListener("click", () => {
    state.logo = ""; state.logoImg = null;
    logoThumb.style.display = "none";
    logoThumb.style.backgroundImage = "";
    logoRemove.style.display = "none";
    logoBtnLabel.textContent = "Upload";
    logoInput.value = "";
    gen();
  });

  // Label
  $("label-input").addEventListener("input", e => {
    state.label = e.target.value;
    scheduleGen();
  });

  // Hotkeys
  window.addEventListener("keydown", e => {
    const mod = e.metaKey || e.ctrlKey;
    if (!mod) return;
    const tgt = e.target;
    const isField = tgt && (tgt.tagName === "INPUT" || tgt.tagName === "TEXTAREA" || tgt.isContentEditable);
    if (e.key === "Enter") {
      e.preventDefault();
      if (ready) downloadPNG();
    } else if (e.key.toLowerCase() === "c" && !isField) {
      e.preventDefault();
      if (ready) copy();
    } else if (e.key.toLowerCase() === "s" && e.shiftKey && !isField) {
      e.preventDefault();
      if (ready) downloadSVG();
    }
  });

  // Page-level drop: dropping a URL fills the URL field (non-conflicting with drag-out).
  document.addEventListener("dragover", e => {
    if (dragging) return;
    e.preventDefault();
  });
  document.addEventListener("drop", e => {
    if (dragging) return;
    const url = e.dataTransfer.getData("text/uri-list") || e.dataTransfer.getData("text/plain");
    if (!url || !/^https?:\/\//i.test(url.trim())) return;
    e.preventDefault();
    state.type = "url";
    setPressed(typesEl, "url", "data-type");
    state.form.url.url = url.trim();
    renderFields();
    gen();
  });

  // ---------- Init ----------
  buildTypes();
  buildSeg(sizeSeg, SIZES, state.size);
  buildSeg(eccSeg, ECLS, state.ecl);
  buildSwatches();
  buildActions();
  setPressed(typesEl, state.type, "data-type");
  sizeHint.textContent = SIZE_PX[state.size] + "px";
  eccHint.textContent = ECC_HINT[state.ecl];
  renderFields();
  gen();
})();
</script>
</body>
</html>
